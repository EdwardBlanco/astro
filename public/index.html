<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerología - Acceso</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <h1 class="logo">Numerología</h1>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button class="tab-btn" onclick="switchTab('register')">Crear Cuenta</button>
            </div>

            <div id="login-form" class="auth-form active">
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <input type="email" id="login-email" required placeholder="tu@email.com">
                    </div>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-login">Entrar</button>
                    <div class="error-msg" id="login-error"></div>
                </form>
            </div>

            <div id="register-form" class="auth-form">
                <form onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="reg-name" required placeholder="Tu Nombre">
                    </div>
                    <div class="input-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="reg-date" required>
                    </div>
                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <input type="email" id="reg-email" required placeholder="tu@email.com">
                    </div>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="reg-password" required minlength="6" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-register">Registrarse</button>
                    <div class="error-msg" id="reg-error"></div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
